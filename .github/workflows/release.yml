name: Prepare or publish ARIADNE release

on:
  push:
    branches: [main]
    paths:
      - PUBLICATION.json
      - .github/workflows/release.yml

permissions:
  contents: write

concurrency:
  group: ariadne-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the requested snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check metadata and audited proof hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, tomllib
          from pathlib import Path
          metadata = json.loads(Path('.zenodo.json').read_text())
          config = json.loads(Path('PUBLICATION.json').read_text())['release_preparation']
          version = metadata['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          assert version == config['version'] == tomllib.loads(Path('lakefile.toml').read_text())['version']
          assert config['requested_state'] in ('draft', 'published')
          assert metadata['creators'] == [{'name': 'Sato, Keisuke', 'affiliation': 'Independent researcher, Japan', 'orcid': '0009-0005-4230-0268'}]
          assert metadata['license'] == 'apache-2.0'
          audit = json.loads(Path('artifacts/audit.json').read_text())
          assert audit['status'] == 'PASS'
          for name, digest in audit['source_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VERSION={version}\nRELEASE_TAG=v{version}\nRELEASE_STATE={config["requested_state"]}\n')
          print('Metadata and all audited Lean source hashes match; this is not a new Lean build.')
          PY
          python3 -B scripts/audit_checkpoint.py --axiom-log artifacts/axioms.log --output "$RUNNER_TEMP/release-inventory.json"

      - name: Package the source and manuscript
        if: env.RELEASE_STATE == 'draft'
        env:
          TZ: UTC
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix="graceful-spider-lean-${VERSION}/" \
            --output="dist/graceful-spider-lean-${VERSION}.zip" HEAD
          cp SOURCES/integrated_v2/PROOF_BOOK_JA.pdf "dist/ARIADNE_Proof_Book_JA_${VERSION}.pdf"
          cp LICENSES/CC-BY-4.0.txt dist/LICENSE-manuscript-CC-BY-4.0.txt
          (cd dist && sha256sum ./*.zip ./*.pdf ./*.txt > SHA256SUMS)

      - name: Create draft or publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE_STATE" = draft ]; then
            if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
              echo "Release already exists; leaving its tag, assets, and state unchanged."
            else
              gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" \
                --title "ARIADNE ${RELEASE_TAG}" --draft --notes-file RELEASE_NOTES.md dist/*
            fi
          else
            expected_id=$(python3 -c 'import json; print(json.load(open("artifacts/release_draft_verification.json"))["release_id"])')
            gh api "repos/${GH_REPO}/releases/${expected_id}" > "$RUNNER_TEMP/existing-release.json"
            if python3 -c 'import json,sys; sys.exit(not json.load(open(sys.argv[1]))["draft"])' "$RUNNER_TEMP/existing-release.json"; then
              gh api "repos/${GH_REPO}/git/matching-refs/tags/${RELEASE_TAG}" > "$RUNNER_TEMP/release-tag-refs.json"
              python3 -B scripts/check_release_draft.py artifacts/release_draft_verification.json \
                "$RUNNER_TEMP/existing-release.json" --tag-refs "$RUNNER_TEMP/release-tag-refs.json"
              gh api --method PATCH "repos/${GH_REPO}/releases/${expected_id}" -F draft=false --silent
            else
              echo "Release is already published; leaving its tag and assets unchanged."
            fi
          fi

      - name: Check the public Zenodo archive
        if: env.RELEASE_STATE == 'published'
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, re, zipfile
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          config = json.loads(Path('PUBLICATION.json').read_text())['release_preparation']
          reported = config.get('zenodo_reported_doi')
          if reported:
              assert re.fullmatch(r'10\.5281/zenodo\.[0-9]+', reported)
              headers = {'User-Agent': 'ARIADNE-release-archive-verification/1.0'}
              with urlopen(Request('https://doi.org/' + reported, headers=headers), timeout=30) as response:
                  resolved = response.url
              parsed = urlparse(resolved)
              assert parsed.hostname in ('zenodo.org', 'www.zenodo.org'), resolved
              match = re.search(r'/records?/([0-9]+)', parsed.path)
              assert match, resolved
              print('ZENODO_RESOLVED_URL=' + resolved)
              with urlopen(Request('https://zenodo.org/api/records/' + match[1], headers=headers), timeout=30) as response:
                  record = json.load(response)
              result = {k: record.get(k) for k in ('id', 'doi', 'conceptdoi', 'metadata', 'links', 'files')}
              print('ZENODO_RECORD=' + json.dumps(result, ensure_ascii=False))
              metadata = record['metadata']
              assert metadata['version'].lstrip('v') == os.environ['VERSION']
              assert metadata['creators'] == [{'name': 'Sato, Keisuke', 'affiliation': 'Independent researcher, Japan', 'orcid': '0009-0005-4230-0268'}]
              assert metadata['license']['id'].lower() in ('apache2.0', 'apache-2.0')
              assert reported in (record['doi'], record['conceptdoi'])
              assert 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] in json.dumps(metadata)
              archives = [f for f in record['files'] if f['key'].endswith('.zip')]
              assert len(archives) == 1
              archive = archives[0]
              assert archive['size'] < 20 * 1024 * 1024
              with urlopen(Request(archive['links']['self'], headers=headers), timeout=60) as response:
                  payload = response.read(20 * 1024 * 1024 + 1)
              assert len(payload) == archive['size']
              assert 'md5:' + hashlib.md5(payload, usedforsecurity=False).hexdigest() == archive['checksum']
              audit = json.loads(Path('artifacts/audit.json').read_text())
              with zipfile.ZipFile(io.BytesIO(payload)) as bundle:
                  assert bundle.testzip() is None
                  assert len(bundle.namelist()) == len(set(bundle.namelist()))
                  roots = [n[:-len('Ariadne.lean')] for n in bundle.namelist() if n.endswith('/Ariadne.lean')]
                  assert len(roots) == 1
                  prefix = roots[0]
                  for name, digest in audit['source_sha256'].items():
                      assert hashlib.sha256(bundle.read(prefix + name)).hexdigest() == digest, name
                  sources = [p for p in Path('SOURCES/integrated_v2').rglob('*') if p.is_file()]
                  for path in sources:
                      assert bundle.read(prefix + path.as_posix()) == path.read_bytes(), str(path)
              print('ZENODO_ARCHIVE_VERIFIED=' + json.dumps({'record_id': record['id'], 'doi': record['doi'], 'conceptdoi': record['conceptdoi'], 'sha256': hashlib.sha256(payload).hexdigest(), 'proof_files': len(audit['source_sha256']), 'frozen_source_files': len(sources)}))
          else:
              print('ZENODO_STATUS=PENDING; awaiting the record DOI, not inferring one from search.')
          PY
